<!doctype html>
<html lang="tr" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate"><title>Claude Masaüstü</title>
<style>
  html,body{margin:0;cursor:none;height:100%;background:radial-gradient(circle at 30% 20%,#2b2f6b,#0d0f14 70%);color:#e8eaf0;font-family:system-ui,sans-serif;overflow:hidden}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px}
  .clock{font-size:150px;font-weight:700;letter-spacing:4px;font-variant-numeric:tabular-nums}
  .date{font-size:30px;opacity:.75}
  .tag{margin-top:20px;font-size:22px;padding:8px 18px;border-radius:999px;background:#4ade8022;color:#4ade80}
  .bar{position:fixed;left:0;right:0;bottom:0;height:48px;background:#0008;display:flex;align-items:center;padding:0 18px;gap:14px;font-size:18px}
  .dot{width:12px;height:12px;border-radius:50%;background:#4ade80}
  .ball{position:fixed;width:60px;height:60px;border-radius:50%;background:#f59e0b}
</style></head><body>
<div class="wrap">
  <div class="clock" id="c"></div>
  <div class="date" id="d"></div>
  <div class="tag">Claude'un sanal masaüstü · canlı</div>
</div>
<div class="ball" id="b"></div>
<div class="bar"><span class="dot"></span><span>Linux sanal ekran :99</span><span style="margin-left:auto" id="up"></span></div>
<script>
  const t0 = Date.now();
  const fmt = new Intl.DateTimeFormat('tr-TR', { timeZone: 'Europe/Istanbul', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const fmtD = new Intl.DateTimeFormat('tr-TR', { timeZone: 'Europe/Istanbul', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  let x = 100, y = 100, vx = 4, vy = 3;
  function tick() {
    const n = new Date();
    c.textContent = fmt.format(n);
    d.textContent = fmtD.format(n);
    const s = Math.floor((Date.now() - t0) / 1000);
    up.textContent = `açık: ${Math.floor(s / 60)} dk ${s % 60} sn`;
  }
  function move() {
    x += vx; y += vy;
    if (x < 0 || x > innerWidth - 60) vx = -vx;
    if (y < 0 || y > innerHeight - 108) vy = -vy;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    requestAnimationFrame(move);
  }
  tick(); setInterval(tick, 250); move();
</script>
</body></html>
